name: Aura Player - Android Release

'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833' # Command-line Tools 23.0 supports SDK 37 metadata.
          packages: 'platform-tools platforms;android-37.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "Missing secrets.SIGNING_KEY_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets (KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)" >&2
            exit 1
          fi
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Prepare signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          VERSION_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr ' ' '-')
          if [ -n "$VERSION_NAME" ]; then
            mv "$APK_PATH" "app/build/outputs/apk/release/AuraPlayer-v${VERSION_NAME}.apk"
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraPlayer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
